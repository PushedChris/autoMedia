services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":19001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "19000:9000"
      - "19001:19001"
    volumes:
      - minio_data:/data

  redis:
    image: redis:7.2
    ports:
      - "16379:6379"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_platform
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    environment:
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET_RAW: raw
      MINIO_BUCKET_PROCESSED: processed
      MINIO_BUCKET_OUTPUT: output
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ai_platform
      LOCAL_GPU_ENABLED: "true"
      USER_SERVICE_URL: http://user-service:8001
      IMAGE_SERVICE_URL: http://image-service:8002
      CONTENT_SERVICE_URL: http://content-service:8003
      TASK_SERVICE_URL: http://task-service:8004
    ports:
      - "18001:8001"
    depends_on:
      - minio
      - redis
      - postgres

  image-service:
    build:
      context: .
      dockerfile: services/image-service/Dockerfile
    environment:
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET_RAW: raw
      MINIO_BUCKET_PROCESSED: processed
      MINIO_BUCKET_OUTPUT: output
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ai_platform
      LOCAL_GPU_ENABLED: "true"
      USER_SERVICE_URL: http://user-service:8001
      IMAGE_SERVICE_URL: http://image-service:8002
      CONTENT_SERVICE_URL: http://content-service:8003
      TASK_SERVICE_URL: http://task-service:8004
    ports:
      - "18002:8002"
    depends_on:
      - minio
      - redis
      - postgres

  content-service:
    build:
      context: .
      dockerfile: services/content-service/Dockerfile
    environment:
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET_RAW: raw
      MINIO_BUCKET_PROCESSED: processed
      MINIO_BUCKET_OUTPUT: output
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ai_platform
      LOCAL_GPU_ENABLED: "true"
      USER_SERVICE_URL: http://user-service:8001
      IMAGE_SERVICE_URL: http://image-service:8002
      CONTENT_SERVICE_URL: http://content-service:8003
      TASK_SERVICE_URL: http://task-service:8004
    ports:
      - "18003:8003"
    depends_on:
      - minio
      - redis
      - postgres

  task-service:
    build:
      context: .
      dockerfile: services/task-service/Dockerfile
    environment:
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET_RAW: raw
      MINIO_BUCKET_PROCESSED: processed
      MINIO_BUCKET_OUTPUT: output
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ai_platform
      LOCAL_GPU_ENABLED: "true"
      USER_SERVICE_URL: http://user-service:8001
      IMAGE_SERVICE_URL: http://image-service:8002
      CONTENT_SERVICE_URL: http://content-service:8003
      TASK_SERVICE_URL: http://task-service:8004
    ports:
      - "18004:8004"
    depends_on:
      - minio
      - redis
      - postgres
      - content-service

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    environment:
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET_RAW: raw
      MINIO_BUCKET_PROCESSED: processed
      MINIO_BUCKET_OUTPUT: output
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ai_platform
      LOCAL_GPU_ENABLED: "true"
      USER_SERVICE_URL: http://user-service:8001
      IMAGE_SERVICE_URL: http://image-service:8002
      CONTENT_SERVICE_URL: http://content-service:8003
      TASK_SERVICE_URL: http://task-service:8004
    ports:
      - "18000:8000"
    depends_on:
      - user-service
      - image-service
      - content-service
      - task-service

volumes:
  minio_data:
  postgres_data:
