name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - develop

env:
  REGISTRY: registry.cn-hangzhou.aliyuncs.com
  REPOSITORY: ai-platform-2026
  IMAGE_TAG: ${{ github.sha }}

jobs:
  lint:
    name: Code Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort

      - name: Run flake8
        run: flake8 services/ shared/ --max-line-length=120

      - name: Run black
        run: black --check services/ shared/

      - name: Run isort
        run: isort --check services/ shared/

  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        service:
          [
            api-gateway,
            user-service,
            image-service,
            content-service,
            task-service,
          ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          tags: ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/${{ matrix.service }}:${{ env.IMAGE_TAG }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r services/api-gateway/requirements.txt
          pip install -r services/user-service/requirements.txt
          pip install -r services/image-service/requirements.txt
          pip install -r services/content-service/requirements.txt
          pip install -r services/task-service/requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run tests,
        run: pytest tests/ -v --tb=short

  push:
    name: Push Docker Images
    runs-on: ubuntu-latest,                      ,
    needs: test
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        service:
          [
            api-gateway,
            user-service,
            image-service,
            content-service,
            task-service,
          
        uses: docker/setup-buildx-action@v3

      - name: Login to Aliyun Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/${{ matrix.service }}:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/${{ matrix.service }}:latest
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-dev:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: push
    if: github.ref == 'refs/heads/develop'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Configure KUBECONFIG
        run: |
          echo "${{ secrets.DEV_KUBECONFIG }}" | base64 -d > /tmp/kubeconfig
          export KUBECONFIG=/tmp/kubeconfig

      - name: Create/update Kubernetes Secret from GitHub Secrets
        run: |
          kubectl create secret generic app-secrets \
            --namespace=ai-platform \
            --from-literal=MINIO_ACCESS_KEY=${{ secrets.MINIO_ACCESS_KEY }} \
            --from-literal=MINIO_SECRET_KEY=${{ secrets.MINIO_SECRET_KEY }} \
            --from-literal=DATABASE_PASSWORD=${{ secrets.DATABASE_PASSWORD }} \
            --from-literal=REGISTRY_URL=${{ secrets.REGISTRY_URL }} \
            --from-literal=REGISTRY_USERNAME=${{ secrets.ALIYUN_REGISTRY_USERNAME }} \
            --from-literal=REGISTRY_PASSWORD=${{ secrets.ALIYUN_REGISTRY_PASSWORD }} \
            --from-literal=REGISTRY_NAMESPACE=${{ secrets.REGISTRY_NAMESPACE }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy to dev
        run: |
          kubectl apply -k k8s/overlays/dev --record
          kubectl rollout status deployment/api-gateway -n ai-platform
          kubectl rollout status deployment/user-service -n ai-platform
          kubectl rollout status deployment/image-service -n ai-platform
          kubectl rollout status deployment/content-service -n ai-platform
          kubectl rollout status deployment/task-service -n ai-platform

  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: push
    if: startsWith(github.ref, 'refs/tags/v')
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Configure KUBECONFIG
        run: |
          echo "${{ secrets.PROD_KUBECONFIG }}" | base64 -d > /tmp/kubeconfig
          export KUBECONFIG=/tmp/kubeconfig

      - name: Create/update Kubernetes Secret from GitHub Secrets
        run: |
          kubectl create secret generic app-secrets \
            --namespace=ai-platform \
            --from-literal=MINIO_ACCESS_KEY=${{ secrets.MINIO_ACCESS_KEY }} \
            --from-literal=MINIO_SECRET_KEY=${{ secrets.MINIO_SECRET_KEY }} \
            --from-literal=DATABASE_PASSWORD=${{ secrets.DATABASE_PASSWORD }} \
            --from-literal=REGISTRY_URL=${{ secrets.REGISTRY_URL }} \
            --from-literal=REGISTRY_USERNAME=${{ secrets.ALIYUN_REGISTRY_USERNAME }} \
            --from-literal=REGISTRY_PASSWORD=${{ secrets.ALIYUN_REGISTRY_PASSWORD }} \
            --from-literal=REGISTRY_NAMESPACE=${{ secrets.REGISTRY_NAMESPACE }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy to prod
        run: |
          kubectl apply -k k8s/overlays/prod --record
          kubectl rollout status deployment/api-gateway -n ai-platform
          kubectl rollout status deployment/user-service -n ai-platform
          kubectl rollout status deployment/image-service -n ai-platform
          kubectl rollout status deployment/content-service -n ai-platform
          kubectl rollout status deployment/task-service -n ai-platform
