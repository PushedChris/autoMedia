apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: ai-platform
spec:
  template:
    spec:
      volumes:
        - name: postgres-data
          emptyDir: {}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: ai-platform
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
